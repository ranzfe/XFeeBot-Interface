<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XFeeBot - Dashboard Keuangan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased" x-data="financeApp()" x-init="initApp()">

    <!-- App Container -->
    <div class="flex h-screen overflow-hidden">

        <!-- Sidebar -->
        <aside class="hidden md:flex md:flex-shrink-0">
            <div class="flex flex-col w-64 bg-slate-900 text-slate-300">
                <div class="flex items-center justify-center h-16 bg-slate-950 px-4">
                    <i class="fa-solid fa-wallet text-brand-500 text-2xl mr-3"></i>
                    <span class="text-lg font-bold text-white tracking-wider">XFee<span class="text-brand-500">Finance</span></span>
                </div>
                <nav class="flex-1 px-4 py-6 space-y-2">
                    <a href="#" @click.prevent="currentTab = 'dashboard'" :class="currentTab === 'dashboard' ? 'bg-brand-600 text-white' : 'hover:bg-slate-800'" class="flex items-center px-4 py-3 rounded-xl transition font-medium">
                        <i class="fa-solid fa-chart-pie w-6"></i> Dashboard
                    </a>
                    <a href="#" @click.prevent="currentTab = 'transactions'" :class="currentTab === 'transactions' ? 'bg-brand-600 text-white' : 'hover:bg-slate-800'" class="flex items-center px-4 py-3 rounded-xl transition font-medium">
                        <i class="fa-solid fa-list-ul w-6"></i> Transaksi
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="flex flex-col flex-1 overflow-y-auto">

            <!-- Top Navbar -->
            <header class="flex items-center justify-between h-16 bg-white border-b border-slate-200 px-6">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold text-slate-800 capitalize" x-text="currentTab"></h1>
                </div>
                <div class="flex items-center space-x-4">
                    <button @click="openModal = true" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-lg shadow-brand-500/30 transition flex items-center">
                        <i class="fa-solid fa-plus mr-2"></i> Catat Transaksi
                    </button>
                </div>
            </header>

            <!-- Main Dynamic View (SPA) -->
            <main class="p-6">

                <!-- Loading State -->
                <template x-if="isLoading">
                    <div class="flex justify-center items-center h-64">
                        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-brand-600"></div>
                    </div>
                </template>

                <!-- DASHBOARD TAB -->
                <div x-show="!isLoading && currentTab === 'dashboard'" class="space-y-6">
                    <!-- Metric Cards -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                            <p class="text-sm font-medium text-slate-500">Total Saldo</p>
                            <h3 class="text-2xl font-bold text-slate-900 mt-2" x-text="formatRupiah(totalBalance)"></h3>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                            <p class="text-sm font-medium text-slate-500">Total Pemasukan</p>
                            <h3 class="text-2xl font-bold text-emerald-600 mt-2" x-text="formatRupiah(totalIncome)"></h3>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                            <p class="text-sm font-medium text-slate-500">Total Pengeluaran</p>
                            <h3 class="text-2xl font-bold text-rose-600 mt-2" x-text="formatRupiah(totalExpense)"></h3>
                        </div>
                    </div>

                    <!-- Charts Section -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                            <h3 class="font-bold text-slate-800 mb-4">Grafik Arus Kas</h3>
                            <canvas id="cashFlowChart" height="150"></canvas>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                            <h3 class="font-bold text-slate-800 mb-4">Pengeluaran berdasarkan Kategori</h3>
                            <canvas id="categoryChart" height="150"></canvas>
                        </div>
                    </div>
                </div>

                <!-- TRANSACTIONS TAB -->
                <div x-show="!isLoading && currentTab === 'transactions'" class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                    <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                        <h3 class="font-bold text-slate-800">Riwayat Transaksi</h3>
                        <input type="text" x-model="search" placeholder="Cari transaksi..." class="px-4 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 text-slate-400 text-xs uppercase tracking-wider">
                                    <th class="p-4 font-semibold">Tanggal</th>
                                    <th class="p-4 font-semibold">Keterangan</th>
                                    <th class="p-4 font-semibold">Kategori</th>
                                    <th class="p-4 font-semibold">Tipe</th>
                                    <th class="p-4 font-semibold text-right">Jumlah</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
                                <template x-for="tx in filteredTransactions" :key="tx.id">
                                    <tr class="hover:bg-slate-50/50">
                                        <td class="p-4 text-slate-600" x-text="tx.date"></td>
                                        <td class="p-4 font-medium text-slate-800" x-text="tx.description"></td>
                                        <td class="p-4"><span class="px-2.5 py-1 text-xs rounded-full bg-slate-100 text-slate-600" x-text="tx.category"></span></td>
                                        <td class="p-4">
                                            <span class="px-2.5 py-1 text-xs rounded-full font-medium" :class="tx.type === 'Pemasukan' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'" x-text="tx.type"></span>
                                        </td>
                                        <td class="p-4 text-right font-semibold" :class="tx.type === 'Pemasukan' ? 'text-emerald-600' : 'text-slate-800'" x-text="formatRupiah(tx.amount)"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- MODAL TAMBAH TRANSAKSI -->
    <div x-show="openModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm" x-cloak>
        <div @click.away="openModal = false" class="bg-white w-full max-w-lg p-6 rounded-2xl shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-lg text-slate-800">Tambah Transaksi Baru</h3>
                <button @click="openModal = false" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form @submit.prevent="submitTransaction" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Tipe</label>
                    <select x-model="form.type" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-brand-500">
                        <option value="Pemasukan">Pemasukan</option>
                        <option value="Pengeluaran">Pengeluaran</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Keterangan</label>
                    <input type="text" x-model="form.description" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-brand-500" placeholder="Contoh: Makan Siang">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Kategori</label>
                        <input type="text" x-model="form.category" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-brand-500" placeholder="Makanan/Gaji">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Jumlah (Rp)</label>
                        <input type="number" x-model="form.amount" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-brand-500" placeholder="50000">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Tanggal</label>
                    <input type="date" x-model="form.date" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-brand-500">
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t">
                    <button type="button" @click="openModal = false" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl">Batal</button>
                    <button type="submit" class="px-5 py-2 text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-xl shadow-lg shadow-brand-500/30">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logika Frontend -->
    <script>
        function financeApp() {
            return {
                currentTab: 'dashboard',
                isLoading: true,
                openModal: false,
                transactions: [],
                search: '',
                form: {
                    type: 'Pengeluaran',
                    description: '',
                    category: '',
                    amount: '',
                    date: new Date().toISOString().split('T')[0]
                },

                initApp() {
                    // Cek ketersediaan google.script.run untuk mencegah error live preview
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        google.script.run
                            .withSuccessHandler(data => {
                                this.transactions = data;
                                this.isLoading = false;
                                this.$nextTick(() => this.renderCharts());
                            })
                            .withFailureHandler(err => {
                                console.error(err);
                                this.loadDummy();
                            })
                            .getTransactions();
                    } else {
                        // Jika dibuka di luar Google Apps Script (Live Preview), pakai data dummy
                        setTimeout(() => {
                            this.loadDummy();
                        }, 500);
                    }
                },

                loadDummy() {
                    this.transactions = [
                        { id: 'TX-001', date: '2023-10-01', description: 'Gaji Bulanan', category: 'Gaji', type: 'Pemasukan', amount: 7500000 },
                        { id: 'TX-002', date: '2023-10-03', description: 'Belanja Supermarket', category: 'Belanja', type: 'Pengeluaran', amount: 1200000 },
                        { id: 'TX-003', date: '2023-10-05', description: 'Bayar Listrik', category: 'Utilitas', type: 'Pengeluaran', amount: 450000 },
                        { id: 'TX-004', date: '2023-10-10', description: 'Freelance Website', category: 'Sampingan', type: 'Pemasukan', amount: 2000000 }
                    ];
                    this.isLoading = false;
                    this.$nextTick(() => this.renderCharts());
                },

                submitTransaction() {
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        google.script.run
                            .withSuccessHandler(res => {
                                alert(res.message);
                                this.openModal = false;
                                this.initApp();
                            })
                            .addTransaction(this.form);
                    } else {
                        // Simulasi sukses lokal untuk preview
                        this.transactions.unshift({
                            id: 'TX-' + Date.now(),
                            ...this.form,
                            amount: Number(this.form.amount)
                        });
                        this.openModal = false;
                        alert('Transaksi berhasil disimpan (Mode Preview)!');
                        this.renderCharts();
                    }
                },

                get totalIncome() {
                    return this.transactions.filter(t => t.type === 'Pemasukan').reduce((acc, t) => acc + Number(t.amount), 0);
                },

                get totalExpense() {
                    return this.transactions.filter(t => t.type === 'Pengeluaran').reduce((acc, t) => acc + Number(t.amount), 0);
                },

                get totalBalance() {
                    return this.totalIncome - this.totalExpense;
                },

                get filteredTransactions() {
                    if (!this.search) return this.transactions;
                    return this.transactions.filter(t => 
                        t.description.toLowerCase().includes(this.search.toLowerCase()) ||
                        t.category.toLowerCase().includes(this.search.toLowerCase())
                    );
                },

                formatRupiah(number) {
                    return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
                },

                renderCharts() {
                    // Chart Arus Kas (Line)
                    const ctxCash = document.getElementById('cashFlowChart');
                    if(ctxCash) {
                        new Chart(ctxCash, {
                            type: 'line',
                            data: {
                                labels: this.transactions.map(t => t.date).reverse(),
                                datasets: [{
                                    label: 'Jumlah Transaksi',
                                    data: this.transactions.map(t => t.type === 'Pemasukan' ? t.amount : -t.amount).reverse(),
                                    borderColor: '#6366f1',
                                    backgroundColor: 'rgba(99, 102, 241, 0.1)',
                                    fill: true,
                                    tension: 0.3
                                }]
                            },
                            options: { responsive: true, plugins: { legend: { display: false } } }
                        });
                    }

                    // Chart Kategori (Doughnut)
                    const ctxCat = document.getElementById('categoryChart');
                    if(ctxCat) {
                        const expenses = this.transactions.filter(t => t.type === 'Pengeluaran');
                        const categories = [...new Set(expenses.map(t => t.category))];
                        const amounts = categories.map(cat => expenses.filter(t => t.category === cat).reduce((sum, t) => sum + t.amount, 0));

                        new Chart(ctxCat, {
                            type: 'doughnut',
                            data: {
                                labels: categories,
                                datasets: [{
                                    data: amounts,
                                    backgroundColor: ['#f43f5e', '#fbbf24', '#38bdf8', '#a855f7', '#34d399']
                                }]
                            },
                            options: { responsive: true }
                        });
                    }
                }
            }
        }
    </script>
</body>
</html>
